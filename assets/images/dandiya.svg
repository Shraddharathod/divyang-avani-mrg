<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="stick1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="stick2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Crossed Dandiya Sticks -->
  <!-- Stick 1 -->
  <g transform="rotate(45 50 50)">
    <rect x="46" y="10" width="8" height="80" rx="4" fill="url(#stick1)" stroke="#881337" stroke-width="1.5"/>
    <rect x="46" y="20" width="8" height="6" fill="#FDE047"/>
    <rect x="46" y="40" width="8" height="6" fill="#FDE047"/>
    <rect x="46" y="60" width="8" height="6" fill="#FDE047"/>
    <!-- Bells at tip -->
    <circle cx="50" cy="10" r="3.5" fill="#D4AF37"/>
    <circle cx="50" cy="90" r="3.5" fill="#D4AF37"/>
  </g>
  <!-- Stick 2 -->
  <g transform="rotate(-45 50 50)">
    <rect x="46" y="10" width="8" height="80" rx="4" fill="url(#stick2)" stroke="#78350F" stroke-width="1.5"/>
    <rect x="46" y="25" width="8" height="6" fill="#0284C7"/>
    <rect x="46" y="45" width="8" height="6" fill="#0284C7"/>
    <rect x="46" y="65" width="8" height="6" fill="#0284C7"/>
    <!-- Bells at tip -->
    <circle cx="50" cy="10" r="3.5" fill="#D4AF37"/>
    <circle cx="50" cy="90" r="3.5" fill="#D4AF37"/>
  </g>
  <!-- Sparkles around sticks -->
  <circle cx="50" cy="20" r="3" fill="#FBBF24"/>
  <circle cx="80" cy="50" r="3" fill="#F43F5E"/>
  <circle cx="20" cy="50" r="3" fill="#F43F5E"/>
  <circle cx="50" cy="80" r="3" fill="#FBBF24"/>
</svg>
